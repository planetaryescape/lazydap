[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/core",
    "crates/daemon",
    "crates/dap",
    "crates/protocol",
    "crates/store",
    "crates/tui",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/planetaryescape/lazydap"
homepage = "https://github.com/planetaryescape/lazydap"
# The fallback for a crate that does not set its own. Every crate here does,
# because "part of lazydap" tells a reader nothing about which part.
description = "A scriptable, terminal-first debugger"
# crates.io allows five keywords of at most twenty characters each. These are
# inherited rather than repeated so a crate cannot drift into describing a
# different product than the one it ships in.
keywords = ["debugger", "dap", "cli", "tui", "debugging"]
# Both are real crates.io category slugs; an invalid one is only rejected at
# publish time, which is exactly when nobody wants to find out.
categories = ["development-tools::debugging", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
# Feature sets are chosen per crate: only the daemon needs the whole runtime.
tokio = { version = "1" }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
# Shell completions for `lazydap completions <shell>`. First-party to clap,
# and generated from the same command tree, so it cannot drift from --help.
clap_complete = "4"
# The TUI's whole stack. ratatui re-exports the crossterm it was compiled
# against (`ratatui::crossterm`), and the TUI uses that rather than a second
# direct dependency: two crossterm versions in one build compile, and then
# hand the backend `KeyEvent`s of a type the widgets do not accept.
ratatui = "0.30"
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
