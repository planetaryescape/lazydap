name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain needed: this reads Cargo.toml files, it does not build.
      - run: bash scripts/check_architecture_boundaries.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  skill:
    name: Skill is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `commands.md` is generated from the CLI, and the ZIP is built from the
      # sources. Both are committed, so both can go stale the moment somebody
      # adds a flag. Rebuilding and diffing is what stops an agent reading a
      # reference for a command line that no longer exists.
      #
      # The build is reproducible by construction (see scripts/build-skill.sh),
      # so a clean tree here means the artefact really does match its sources —
      # not merely that it was rebuilt.
      - run: bash scripts/build-skill.sh
      - name: Check the committed skill matches its sources
        run: |
          if ! git diff --exit-code -- skill/ lazydap.skill; then
            echo "::error::The skill is out of date. Run scripts/build-skill.sh and commit the result."
            exit 1
          fi
      - name: Check the ZIP contains what the sources say
        run: |
          unzip -q -o lazydap.skill -d /tmp/skill-check
          diff -r skill/ /tmp/skill-check

  site:
    name: Docs site
    runs-on: ubuntu-latest
    # Deliberately not gated on `site/**`. The CLI reference is generated from
    # the clap definitions in crates/daemon, so a pure-Rust PR that renames a
    # flag is exactly the change that makes the committed reference stale. A
    # path filter here would let that through. It is a separate job, so the Rust
    # gates do not wait on it either way.
    steps:
      - uses: actions/checkout@v4

      # The CLI reference is generated by running `lazydap --help`, so the
      # binary has to exist before `npm run build` does anything useful. Same
      # toolchain and cache as the Rust jobs.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin lazydap

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      # Builds the CLI reference from the binary, validates links and banned
      # claims, renders the site, then writes llms-full.txt.
      - run: npm run build
        working-directory: site

      # The reference is committed so it can be reviewed in a diff. That only
      # helps if it is actually current, which is what this checks: the build
      # above already regenerated it, so anything git sees is drift.
      - name: Check the committed CLI reference matches the binary
        run: |
          if ! git diff --exit-code -- site/src/content/docs/reference/cli; then
            echo "::error::The CLI reference is out of date. Run 'npm run generate' in site/ and commit the result."
            exit 1
          fi
