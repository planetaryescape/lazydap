name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain needed: this reads Cargo.toml files, it does not build.
      - run: bash scripts/check_architecture_boundaries.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  skill:
    name: Skill is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `commands.md` is generated from the CLI, and the ZIP is built from the
      # sources. Both are committed, so both can go stale the moment somebody
      # adds a flag. Rebuilding and diffing is what stops an agent reading a
      # reference for a command line that no longer exists.
      #
      # The build is reproducible by construction (see scripts/build-skill.sh),
      # so a clean tree here means the artefact really does match its sources —
      # not merely that it was rebuilt.
      - run: bash scripts/build-skill.sh
      - name: Check the committed skill matches its sources
        run: |
          if ! git diff --exit-code -- skill/ lazydap.skill; then
            echo "::error::The skill is out of date. Run scripts/build-skill.sh and commit the result."
            exit 1
          fi
      - name: Check the ZIP contains what the sources say
        run: |
          unzip -q -o lazydap.skill -d /tmp/skill-check
          diff -r skill/ /tmp/skill-check

  site:
    name: Docs site
    runs-on: ubuntu-latest
    # Deliberately not gated on `site/**`. The CLI reference is generated from
    # the clap definitions in crates/daemon, so a pure-Rust PR that renames a
    # flag is exactly the change that makes the committed reference stale. A
    # path filter here would let that through. It is a separate job, so the Rust
    # gates do not wait on it either way.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      # Deliberately first, and with no Rust in scope. `npm run build` must work
      # for someone who has only cloned the repo and installed Node — that is
      # also all a Vercel deploy gets — so it renders the committed CLI pages
      # rather than regenerating them.
      - run: npm run build
        working-directory: site

      # Regenerating is a separate concern, and it is the only part that needs
      # cargo. Same toolchain and cache as the Rust jobs.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin lazydap

      # The reference is committed so a flag change shows up in review. That
      # only helps if it is current: regenerate against the binary just built
      # and let git say whether anything moved. LAZYDAP_BIN is explicit so a
      # cached release binary cannot answer instead.
      - name: Check the committed CLI reference matches the binary
        working-directory: site
        env:
          LAZYDAP_BIN: ${{ github.workspace }}/target/debug/lazydap
        run: |
          if ! npm run check:generated; then
            echo "::error::The CLI reference is out of date. Run 'cargo build --bin lazydap' then 'npm run generate' in site/, and commit the result."
            exit 1
          fi
