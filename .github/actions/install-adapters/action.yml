name: Install DAP adapters
description: >
  Puts codelldb, debugpy and dlv on PATH so the real-adapter suites in
  crates/daemon/tests/ run instead of skipping themselves.

# Pinned, not `latest`. These versions are what the suites' assertions were
# written against — a quirk that goes away upstream should turn up as a
# deliberate bump with the quirk entry retired, not as a Tuesday where CI went
# red on its own.
inputs:
  codelldb-version:
    description: codelldb release tag, without the leading `v`.
    default: '1.12.2'
  debugpy-version:
    description: debugpy version on PyPI.
    default: '1.8.21'
  delve-version:
    description: delve module version, without the leading `v`.
    default: '1.27.0'

runs:
  using: composite
  steps:
    # 55 MB of vsix per run otherwise, and the contents are immutable for a
    # given tag. The platform is in the key because the bundle is per-platform
    # and the cache is not.
    - name: Cache codelldb
      id: codelldb-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/opt/codelldb
        key: codelldb-${{ inputs.codelldb-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download codelldb
      if: steps.codelldb-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Retried: this is the one step that reaches outside GitHub, and a
        # release must not fail on somebody else's five seconds of 502.
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/codelldb.vsix \
          "https://github.com/vadimcn/codelldb/releases/download/v${{ inputs.codelldb-version }}/codelldb-linux-x64.vsix"
        # Unpacked beside the destination and moved into place only once it is
        # whole: the cache is saved from that path under a stable key, so a
        # half-finished unzip would be cached as if it were the real thing and
        # every later run would restore the broken copy.
        rm -rf /tmp/codelldb-unpack ~/.local/opt/codelldb
        unzip -q /tmp/codelldb.vsix -d /tmp/codelldb-unpack
        mkdir -p ~/.local/opt
        mv /tmp/codelldb-unpack ~/.local/opt/codelldb

    - name: Put codelldb on PATH
      shell: bash
      run: |
        set -euo pipefail
        # A wrapper script, never a symlink: codelldb finds liblldb by walking
        # up from argv[0], so through a symlink on PATH it looks one directory
        # too high and dies in dlopen (quirk 1, docs/issues/0001).
        mkdir -p ~/.local/bin
        cat > ~/.local/bin/codelldb <<'WRAPPER'
        #!/usr/bin/env bash
        exec "$HOME/.local/opt/codelldb/extension/adapter/codelldb" "$@"
        WRAPPER
        chmod +x ~/.local/bin/codelldb
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # `--help` proves nothing: clap answers it and exits before main, so it
    # returns 0 through an install whose liblldb cannot be found (quirk 1).
    # `--port 0` is the invocation that dlopens it — the one lazydap makes — so
    # start that, and see that it is still alive a moment later. Turns a broken
    # bundle into a failure with a name rather than two dozen adapter timeouts.
    - name: Check codelldb can load liblldb
      shell: bash
      run: |
        set -euo pipefail
        ~/.local/bin/codelldb --port 0 &
        adapter=$!
        sleep 3
        if ! kill -0 "$adapter" 2>/dev/null; then
          echo "::error::codelldb --port 0 died on startup; the bundle is broken"
          exit 1
        fi
        kill "$adapter"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Into the interpreter setup-python just made `python3`, which is the one
    # the daemon's discovery will find and run `-m debugpy.adapter` under.
    - name: Install debugpy
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --retries 5 \
          "debugpy==${{ inputs.debugpy-version }}"
        python3 -c 'import debugpy; print(debugpy.__version__)'

    # Pinned, and pinned *with* delve: dlv refuses a toolchain newer than it
    # knows ("version of Delve is too old for Go version"), and lazydap never
    # passes `--check-go-version=false`. `stable` would break this job the week
    # Go releases. Bump the two together.
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        # There is no go.sum in this repository — the Go fixtures depend on
        # nothing — and setup-go's cache has no key to build without one.
        cache: false

    - name: Cache dlv
      id: dlv-cache
      uses: actions/cache@v4
      with:
        path: ~/go/bin/dlv
        key: dlv-${{ inputs.delve-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install dlv
      if: steps.dlv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go install "github.com/go-delve/delve/cmd/dlv@v${{ inputs.delve-version }}"

    - name: Put dlv on PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        "$(go env GOPATH)/bin/dlv" version

    # Yama's default scope of 1 lets a tracer follow its own descendants, which
    # is all a launch needs; a runner image shipping scope 2 or 3 would block
    # even PTRACE_TRACEME and every adapter here would fail at once. Cheap
    # insurance, and `|| true` because a runner that refuses the write is
    # telling us the setting is not ours to change.
    - name: Allow ptrace
      shell: bash
      run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true
