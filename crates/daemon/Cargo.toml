[package]
name = "lazydap-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The lazydap binary: CLI subcommands, the daemon that owns the debug session, and the entrypoint to the TUI"
publish = false

# The product is one binary called `lazydap` (D002). `main.rs` is a thin
# entrypoint; everything it calls lives in the library so integration tests can
# reach it without going through a subprocess.
[lib]
name = "lazydap_daemon"
path = "src/lib.rs"

[[bin]]
name = "lazydap"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lazydap-config = { path = "../config" }
lazydap-core = { path = "../core" }
lazydap-dap = { path = "../dap" }
lazydap-protocol = { path = "../protocol" }
lazydap-store = { path = "../store" }
lazydap-tui = { path = "../tui" }

[dev-dependencies]
# `start_paused` in `wait.rs`, which is what makes the late-exit-code test a
# fact about the code rather than a race against the machine's load. Stated
# here rather than relied on: a `--workspace` build unified the feature in from
# elsewhere and a plain `cargo test -p lazydap-daemon` then did not compile.
tokio = { workspace = true, features = ["full", "test-util"] }
