[package]
name = "lazydap-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Per-project state that outlives a debug session, persisted to .lazydap/state.toml"
publish = false

[lints]
workspace = true

[dependencies]
# `sync` for the dirty-flag notifier, `time` for the debounce window. The store
# does not need a whole runtime.
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
lazydap-core = { path = "../core" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
